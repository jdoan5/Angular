<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/" (click)="store.backToCategories()">
      <span class="brand-mark">☞</span>
      <span class="brand-name">Hangman <em>Encyclopedia</em></span>
    </a>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Play</a>
      <a routerLink="/encyclopedia" routerLinkActive="active">Encyclopedia</a>
    </nav>

    <div class="tally" aria-label="Current streak and collection size">
      <span title="Current streak">🔥 {{ store.stats().streak }}</span>
      <span title="Entries collected">📖 {{ store.collectedCount() }}</span>
    </div>

    <button
      type="button"
      class="theme-toggle"
      aria-label="Dark mode"
      [attr.aria-pressed]="theme.isDark()"
      [title]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="theme.toggle()"
    >
      <!-- Both icons render; CSS shows the one for the other theme (keyed off
           <html data-theme>, so it swaps in the same frame as the palette). -->
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6" />
      </svg>
    </button>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="foot">
  <p class="muted">Solve a word · unlock its story — a little encyclopedia, one game at a time.</p>
</footer>
