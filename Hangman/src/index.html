<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hangman Encyclopedia</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b2620">
  <meta name="description" content="A hangman game where every solved word unlocks a real encyclopedia entry. Twelve volumes, 400+ fact-checked entries, light and dark themes.">
  <script>
    // Stamp the saved theme before first paint so dark-mode readers never see a
    // flash of parchment. Mirrors ThemeService (key `he.theme`, JSON-encoded).
    (function () {
      var pref;
      try { pref = JSON.parse(localStorage.getItem('he.theme')); } catch (e) {}
      var dark = pref === 'dark' ||
        (pref !== 'light' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a1612');
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,650;1,500&family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  >
</head>
<body>
  <app-root></app-root>
</body>
</html>
