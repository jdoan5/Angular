name: gold-snapshot

# Refreshes review-radar/public/gold_snapshot.json from the Databricks gold
# tables, once a day after the lakehouse's 7:00 AM America/New_York job.
# The commit triggers Vercel's auto-redeploy of the review-radar app.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DATABRICKS_HOST          e.g. https://dbc-xxxxxxxx-xxxx.cloud.databricks.com
#   DATABRICKS_TOKEN         PAT named github-action-snapshot (SQL scope)
#   DATABRICKS_WAREHOUSE_ID  the serverless SQL warehouse id

on:
  schedule:
    - cron: "30 13 * * *" # ~9:30 AM ET (13:30 UTC; drifts 1h with DST — fine)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gold-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Execute gold snapshot query
        env:
          HOST: ${{ secrets.DATABRICKS_HOST }}
          TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: |
          set -euo pipefail

          # Call the Databricks API and print its error body on failure. The old
          # `RESP=$(curl --fail-with-body ...)` captured the body into RESP and
          # then set -e exited before anything printed it: from 2026-09-15 the
          # job failed nine days running showing only "curl: (22) ... 400",
          # while Databricks was saying why. Errors go to stderr on purpose:
          # dbx runs inside $(...), which would capture stdout and hide them
          # all over again. Plain --retry retries only transient failures
          # (timeouts, 408/429/5xx); --retry-all-errors retried every 400.
          dbx() {
            local method="$1" url="$2" data="${3:-}" out code
            out=$(mktemp)
            local args=(-sS -o "$out" -w '%{http_code}' --retry 3 --retry-delay 5
              -X "$method" "$url" -H "Authorization: Bearer $TOKEN")
            if [ -n "$data" ]; then
              args+=(-H "Content-Type: application/json" -d "$data")
            fi
            code=$(curl "${args[@]}")
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error title=Databricks API returned $code::$(jq -r '"\(.error_code // "?"): \(.message // "no message")"' "$out" 2>/dev/null || head -c 300 "$out")" >&2
              { jq . "$out" 2>/dev/null || cat "$out"; } >&2
              exit 1
            fi
            cat "$out"
          }

          BODY=$(jq -n \
            --arg wid "$WAREHOUSE_ID" \
            --rawfile stmt .github/workflows/gold_snapshot.sql \
            '{warehouse_id: $wid, statement: $stmt, wait_timeout: "50s", on_wait_timeout: "CONTINUE"}')

          RESP=$(dbx POST "$HOST/api/2.0/sql/statements" "$BODY")

          STATEMENT_ID=$(echo "$RESP" | jq -r '.statement_id')
          STATE=$(echo "$RESP" | jq -r '.status.state')

          # Poll while the warehouse wakes up (serverless cold start).
          TRIES=0
          while [ "$STATE" = "PENDING" ] || [ "$STATE" = "RUNNING" ]; do
            TRIES=$((TRIES + 1))
            if [ "$TRIES" -gt 20 ]; then
              echo "Timed out waiting for statement $STATEMENT_ID (state=$STATE)"
              exit 1
            fi
            sleep 10
            RESP=$(dbx GET "$HOST/api/2.0/sql/statements/$STATEMENT_ID")
            STATE=$(echo "$RESP" | jq -r '.status.state')
          done

          if [ "$STATE" != "SUCCEEDED" ]; then
            echo "Statement finished in state $STATE"
            echo "$RESP" | jq '.status'
            exit 1
          fi

          # The whole snapshot is one cell in one row — anything chunked or
          # truncated means the API returned something unexpected. Fail loudly
          # rather than let the sanity check below produce a confusing error.
          echo "$RESP" | jq -e '((.manifest.total_chunk_count // 1) == 1) and (.manifest.truncated != true)' > /dev/null \
            || { echo "Unexpected chunked/truncated result"; echo "$RESP" | jq '.manifest'; exit 1; }

          echo "$RESP" | jq -r '.result.data_array[0][0]' \
            | jq --arg ts "$(date -u +%FT%TZ)" '. + {generated_at: $ts}' \
            > review-radar/public/gold_snapshot.json

          # Sanity: the file must be valid JSON with the expected keys.
          jq -e '.totals.reviews_collected and (.overview | length > 0)' \
            review-radar/public/gold_snapshot.json > /dev/null
          echo "Snapshot OK: $(jq -c '.totals' review-radar/public/gold_snapshot.json)"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add review-radar/public/gold_snapshot.json
          if git diff --cached --quiet; then
            echo "No data change — nothing to commit."
          else
            git commit -m "chore(review-radar): refresh gold snapshot"
            git pull --rebase origin main
            git push
          fi
